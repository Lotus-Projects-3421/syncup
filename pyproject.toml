[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncup"
version = "1.4.1"
description = "Safe Android phone photo/video backup and Google Takeout organizer for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SyncUp contributors" }]
keywords = ["android", "mtp", "photos", "backup", "google-takeout", "flet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["flet[desktop]==1.0.4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "python-multipart>=0.0.9", "qrcode>=7.4,<9"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Lotus-Projects-3421/syncup"
Repository = "https://github.com/Lotus-Projects-3421/syncup"
Issues = "https://github.com/Lotus-Projects-3421/syncup/issues"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "views*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist", "AppDir", ".venv", "appimagetool"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
