[package]
name = "syncup"
version = "2.0.0"
description = "Safe Android phone photo/video backup and Google Takeout organizer"
authors = ["SyncUp contributors"]
edition = "2021"
default-run = "syncup"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Lotus-Projects-3421/syncup"

[lib]
name = "syncup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "syncup"
path = "src/main.rs"

[[bin]]
name = "specta-gen"
path = "src/bin/specta_gen.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
regex = "1.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
# blake2 0.10.6 (2023-10-09)
blake2 = "0.10.6"
r2d2 = "0.8.10"
r2d2_sqlite = "0.37.1"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri = { version = "2.12.7", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
# tempfile 3.27.0 (promoted from dev-dependencies)
tempfile = "3.27.0"
thiserror = "2.0.21"
# tokio 1.54.1 (2026-02-18)
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
# tokio-util 0.7.20 (2026-02-18)
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# gio 0.18.4 / glib 0.18.5 pinned to Cargo.lock (Phase 5 MTP discovery via GVFS/GIO).
gio = "=0.18.4"
glib = "=0.18.5"
# Phase 6 Wi-Fi server. axum is new; getrandom/subtle/hex/http-body-util pin to
# versions already present in Cargo.lock (0.3.4 / 2.6.1 / 0.4.3 / 0.1.5).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.3"
http-body-util = "0.1"
hex = "0.4"
subtle = "2"

[target.'cfg(unix)'.dependencies]
# libc 0.2.191 (2026-02-18)
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# windows-sys 0.59.0 (2024-09-08)
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
sha2 = "0.10"
